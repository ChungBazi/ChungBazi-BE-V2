services:
  chungbazi-app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: chungbazi-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      FIREBASE_ENABLED: "true"
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/secrets/firebase-service-account.json
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m
    volumes:
      - ./config/application.yml:/app/config/application.yml:ro
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: chungbazi-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
