services:
  chungbazi-app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: chungbazi-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      - mysql
      - redis
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FIREBASE_ENABLED: "true"
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/secrets/firebase-service-account.json
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    volumes:
      - ./config/application.yml:/app/config/application.yml:ro
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.4
    container_name: chungbazi-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: chungbaziv2
      MYSQL_USER: chungbazi
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: chungbazi-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
  redis-data:
