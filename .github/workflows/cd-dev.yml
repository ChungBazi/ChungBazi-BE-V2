name: Development CD workflow

on:
  workflow_run:
    workflows:
      - CI workflow
    types:
      - completed
    branches:
      - develop

permissions:
  contents: read
  actions: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified Docker image
    if: >-
      github.repository == 'ChungBazi/ChungBazi-BE-V2' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download verified JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKER_REPO }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=chungbazi-app
          cache-to: type=gha,mode=max,scope=chungbazi-app

  deploy:
    name: Deploy development
    needs: publish
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Copy development Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.dev.yml
          target: /home/ubuntu/app
          strip_components: 1

      - name: Deploy development
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ secrets.DOCKER_REPO }}:${{ github.event.workflow_run.head_sha }}
          APPLICATION_YML: ${{ secrets.APPLICATION_DEV_YML }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_IMAGE,APPLICATION_YML,FIREBASE_SERVICE_ACCOUNT_JSON
          script: |
            set -eu
            cd /home/ubuntu/app

            : "${APP_IMAGE:?APP_IMAGE is required}"
            : "${APPLICATION_YML:?APPLICATION_DEV_YML secret is required}"
            : "${FIREBASE_SERVICE_ACCOUNT_JSON:?FIREBASE_SERVICE_ACCOUNT_JSON secret is required}"

            umask 077
            mkdir -p ./config ./secrets
            printf '%s' "$APPLICATION_YML" > ./config/application.yml
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > ./secrets/firebase-service-account.json
            chmod 0444 ./config/application.yml ./secrets/firebase-service-account.json

            PREVIOUS_IMAGE=$(docker inspect --format '{{.Config.Image}}' chungbazi-app 2>/dev/null || true)
            export APP_IMAGE

            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d mysql redis
            docker compose -f docker-compose.dev.yml up -d --no-deps chungbazi-app

            READY=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --output /dev/null http://127.0.0.1:8080/api/v1/global/health-check; then
                READY=true
                break
              fi
              sleep 5
            done

            if [ "$READY" != "true" ]; then
              docker compose -f docker-compose.dev.yml logs --tail=100 chungbazi-app
              if [ -n "$PREVIOUS_IMAGE" ]; then
                APP_IMAGE="$PREVIOUS_IMAGE" docker compose -f docker-compose.dev.yml up -d --no-deps chungbazi-app
              fi
              exit 1
            fi

            docker image prune -f
