name: Production CD workflow

on:
  workflow_run:
    workflows:
      - CI workflow
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified Docker image
    if: >-
      github.repository == 'ChungBazi/ChungBazi-BE-V2' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download verified JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKER_REPO }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=chungbazi-app
          cache-to: type=gha,mode=max,scope=chungbazi-app

  deploy:
    name: Deploy production
    needs: publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Copy production Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/deploy.sh
          target: /home/ubuntu/app/incoming
          strip_components: 1

      - name: Deploy production
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ secrets.DOCKER_REPO }}:${{ github.event.workflow_run.head_sha }}
          COMPOSE_FILE: docker-compose.prod.yml
          APPLICATION_YML: ${{ secrets.APPLICATION_PROD_YML }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_IMAGE,COMPOSE_FILE,APPLICATION_YML,FIREBASE_SERVICE_ACCOUNT_JSON
          script: |
            bash /home/ubuntu/app/incoming/deploy.sh
